<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise Your Hand | Staff Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f8;
      color: #222;
    }

    .top-bar {
      height: 10px;
      background: #00a6a6;
    }

    .hidden {
      display: none !important;
    }

    .login-wrap {
      min-height: calc(100vh - 10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.09);
    }

    .login-icon {
      text-align: center;
      font-size: 52px;
    }

    .login-card h1 {
      text-align: center;
      margin: 5px 0 0;
      font-size: 28px;
    }

    .login-subtitle {
      text-align: center;
      color: #66757f;
      margin: 8px 0 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cfd8dc;
      border-radius: 9px;
    }

    button {
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      background: #00a6a6;
      color: white;
      font-size: 17px;
    }

    .login-error {
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      background: #fde8e8;
      color: #a61b1b;
      font-size: 14px;
      display: none;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 28px 20px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 6px;
      color: #66757f;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .count-box {
      background: white;
      padding: 13px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      font-weight: bold;
    }

    .signout-btn {
      padding: 12px 15px;
      background: #263238;
      color: white;
    }

    .signed-in {
      width: 100%;
      text-align: right;
      font-size: 12px;
      color: #7b8a8b;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }

    .column {
      background: #eef2f3;
      border-radius: 16px;
      padding: 14px;
      min-height: 250px;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .column-title {
      font-size: 18px;
      font-weight: bold;
    }

    .badge {
      background: white;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .requests {
      display: grid;
      gap: 13px;
    }

    .request-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .waiting-card {
      border-left: 6px solid #f0b429;
    }

    .claimed-card {
      border-left: 6px solid #3f8cff;
    }

    .done-card {
      border-left: 6px solid #4caf50;
    }

    .student-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .location {
      color: #66757f;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .info-row {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .info-label {
      font-weight: bold;
    }

    .details {
      margin-top: 10px;
      background: #f7f9fa;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .claim-btn {
      background: #3f8cff;
      color: white;
      padding: 10px 13px;
    }

    .done-btn {
      background: #4caf50;
      color: white;
      padding: 10px 13px;
    }

    .empty {
      text-align: center;
      color: #7b8a8b;
      padding: 25px 10px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #7b8a8b;
      margin-top: 30px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .signed-in {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<div class="top-bar"></div>

<section id="loginView" class="login-wrap">
  <div class="login-card">

    <div class="login-icon">✋</div>
    <h1>Raise Your Hand</h1>
    <div class="login-subtitle">Staff Sign In</div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginButton" class="login-btn">Sign In</button>

    <div id="loginError" class="login-error"></div>
  </div>
</section>

<main id="dashboardView" class="page hidden">

  <div class="header">

    <div>
      <h1>✋ Raise Your Hand</h1>
      <div class="subtitle">Staff Support Dashboard</div>
    </div>

    <div class="header-actions">
      <div class="count-box">
        Active: <span id="activeCount">0</span>
      </div>

      <button id="signOutButton" class="signout-btn">Sign Out</button>

      <div id="signedInUser" class="signed-in"></div>
    </div>

  </div>

  <div class="dashboard-grid">

    <section class="column">
      <div class="column-header">
        <div class="column-title">🟡 Waiting</div>
        <div class="badge" id="waitingCount">0</div>
      </div>

      <div id="waitingRequests" class="requests"></div>
    </section>

    <section class="column">
      <div class="column-header">
        <div class="column-title">🔵 Claimed</div>
        <div class="badge" id="claimedCount">0</div>
      </div>

      <div id="claimedRequests" class="requests"></div>
    </section>

    <section class="column">
      <div class="column-header">
        <div class="column-title">🟢 Done</div>
        <div class="badge" id="doneCount">0</div>
      </div>

      <div id="doneRequests" class="requests"></div>
    </section>

  </div>

  <div class="footer">
    Acceleration Academies • Student Support
  </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCDnic_epgNwGm8XGNYosNpvfk8iaREXFk",
  authDomain: "raise-your-hand-10653.firebaseapp.com",
  projectId: "raise-your-hand-10653",
  storageBucket: "raise-your-hand-10653.firebasestorage.app",
  messagingSenderId: "154525540176",
  appId: "1:154525540176:web:00e219db67fe4f0c315655"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


const loginView = document.getElementById("loginView");
const dashboardView = document.getElementById("dashboardView");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginButton = document.getElementById("loginButton");
const signOutButton = document.getElementById("signOutButton");

const loginError = document.getElementById("loginError");
const signedInUser = document.getElementById("signedInUser");

const waitingRequests = document.getElementById("waitingRequests");
const claimedRequests = document.getElementById("claimedRequests");
const doneRequests = document.getElementById("doneRequests");

const waitingCount = document.getElementById("waitingCount");
const claimedCount = document.getElementById("claimedCount");
const doneCount = document.getElementById("doneCount");
const activeCount = document.getElementById("activeCount");

let unsubscribeRequests = null;


function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatTime(timestamp) {
  if (!timestamp) return "Just now";
  return timestamp.toDate().toLocaleString();
}


function createCard(request, requestId) {

  const card = document.createElement("div");

  if (request.status === "WAITING") {
    card.className = "request-card waiting-card";
  }

  if (request.status === "CLAIMED") {
    card.className = "request-card claimed-card";
  }

  if (request.status === "DONE") {
    card.className = "request-card done-card";
  }

  card.innerHTML = `

    <div class="student-name">
      ${escapeHtml(request.studentName)}
    </div>

    <div class="location">
      ${escapeHtml(request.location)}
    </div>

    <div class="info-row">
      <span class="info-label">Help:</span>
      ${escapeHtml(request.helpType)}
    </div>

    <div class="info-row">
      <span class="info-label">Contact:</span>
      ${escapeHtml(request.contactMethod)}
    </div>

    <div class="info-row">
      <span class="info-label">Submitted:</span>
      ${formatTime(request.createdAt)}
    </div>

    ${
      request.claimedBy
        ? `
          <div class="info-row">
            <span class="info-label">Claimed by:</span>
            ${escapeHtml(request.claimedBy)}
          </div>
        `
        : ""
    }

    ${
      request.details
        ? `
          <div class="details">
            ${escapeHtml(request.details)}
          </div>
        `
        : ""
    }

    <div class="actions">

      ${
        request.status === "WAITING"
          ? `
            <button
              class="claim-btn"
              data-action="claim"
              data-id="${requestId}">
              Claim Request
            </button>
          `
          : ""
      }

      ${
        request.status === "CLAIMED"
          ? `
            <button
              class="done-btn"
              data-action="done"
              data-id="${requestId}">
              Mark Done
            </button>
          `
          : ""
      }

    </div>
  `;

  return card;
}


function startRequestListener() {

  if (unsubscribeRequests) {
    unsubscribeRequests();
  }

  const requestsQuery = query(
    collection(db, "requests"),
    orderBy("createdAt", "desc")
  );

  unsubscribeRequests = onSnapshot(
    requestsQuery,
    (snapshot) => {

      waitingRequests.innerHTML = "";
      claimedRequests.innerHTML = "";
      doneRequests.innerHTML = "";

      let waiting = 0;
      let claimed = 0;
      let done = 0;

      snapshot.forEach((documentSnapshot) => {

        const request = documentSnapshot.data();
        const requestId = documentSnapshot.id;

        const card = createCard(request, requestId);

        if (request.status === "WAITING") {
          waiting++;
          waitingRequests.appendChild(card);
        }

        if (request.status === "CLAIMED") {
          claimed++;
          claimedRequests.appendChild(card);
        }

        if (request.status === "DONE") {
          done++;
          doneRequests.appendChild(card);
        }
      });


      if (waiting === 0) {
        waitingRequests.innerHTML =
          '<div class="empty">No students waiting 🎉</div>';
      }

      if (claimed === 0) {
        claimedRequests.innerHTML =
          '<div class="empty">No claimed requests</div>';
      }

      if (done === 0) {
        doneRequests.innerHTML =
          '<div class="empty">No completed requests yet</div>';
      }


      waitingCount.textContent = waiting;
      claimedCount.textContent = claimed;
      doneCount.textContent = done;

      activeCount.textContent = waiting + claimed;
    }
  );
}


async function handleLogin() {

  loginError.style.display = "none";

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    loginError.textContent = "Enter your email and password.";
    loginError.style.display = "block";
    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (error) {

    console.error(error);

    loginError.textContent =
      "Unable to sign in. Check your email and password.";

    loginError.style.display = "block";
  }
}


loginButton.addEventListener("click", handleLogin);

passwordInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    handleLogin();
  }
});


signOutButton.addEventListener("click", async () => {
  await signOut(auth);
});


document.addEventListener("click", async (event) => {

  const button = event.target.closest("button");

  if (!button) return;

  const requestId = button.dataset.id;
  const action = button.dataset.action;

  if (!requestId || !action) return;


  if (action === "claim") {

    const staffName = prompt(
      "Enter your name so the team knows who claimed this request:"
    );

    if (!staffName || !staffName.trim()) return;

    await updateDoc(
      doc(db, "requests", requestId),
      {
        status: "CLAIMED",
        claimedBy: staffName.trim(),
        claimedAt: serverTimestamp()
      }
    );
  }


  if (action === "done") {

    await updateDoc(
      doc(db, "requests", requestId),
      {
        status: "DONE",
        completedAt: serverTimestamp()
      }
    );
  }
});


onAuthStateChanged(auth, (user) => {

  if (user) {

    loginView.classList.add("hidden");
    dashboardView.classList.remove("hidden");

    signedInUser.textContent =
      `Signed in as ${user.email}`;

    startRequestListener();

  } else {

    dashboardView.classList.add("hidden");
    loginView.classList.remove("hidden");

    if (unsubscribeRequests) {
      unsubscribeRequests();
      unsubscribeRequests = null;
    }
  }
});

</script>

</body>
</html>
