<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise Your Hand | Staff Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f8;
      color: #222;
    }

    .top-bar {
      height: 10px;
      background: #00a6a6;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 28px 20px 50px;
    }

    .hidden {
      display: none !important;
    }

    .login-wrap {
      min-height: calc(100vh - 10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.09);
    }

    .login-icon {
      text-align: center;
      font-size: 52px;
      margin-bottom: 5px;
    }

    .login-card h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
      color: #263238;
    }

    .login-subtitle {
      text-align: center;
      color: #66757f;
      margin: 8px 0 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cfd8dc;
      border-radius: 9px;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #00a6a6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #008d8d;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-error {
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      background: #fde8e8;
      color: #a61b1b;
      font-size: 14px;
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .header-left h1 {
      margin: 0;
      font-size: 32px;
      color: #263238;
    }

    .subtitle {
      margin-top: 6px;
      color: #66757f;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .count-box {
      background: white;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      font-weight: bold;
    }

    .signout-btn {
      border: none;
      border-radius: 9px;
      padding: 12px 15px;
      background: #263238;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .signed-in {
      width: 100%;
      font-size: 12px;
      color: #7b8a8b;
      text-align: right;
    }

    .requests {
      display: grid;
      gap: 16px;
    }

    .request-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      border-left: 7px solid #f0b429;
    }

    .request-card.claimed {
      border-left-color: #3f8cff;
    }

    .request-card.done {
      border-left-color: #4caf50;
      opacity: .75;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: start;
      flex-wrap: wrap;
    }

    .student-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.waiting {
      background: #fff3cd;
      color: #856404;
    }

    .status.claimed {
      background: #dbeafe;
      color: #1e4f91;
    }

    .status.done {
      background: #dff3e4;
      color: #256c35;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .meta-item {
      background: #f7f9fa;
      border-radius: 9px;
      padding: 11px;
    }

    .meta-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #718086;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .details {
      margin-top: 14px;
      padding: 14px;
      background: #f7f9fa;
      border-radius: 9px;
      line-height: 1.45;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .claim-btn,
    .done-btn {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .claim-btn {
      background: #3f8cff;
      color: white;
    }

    .done-btn {
      background: #4caf50;
      color: white;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 40px 20px;
      border-radius: 16px;
      color: #66757f;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }

    .footer {
      text-align: center;
      color: #7b8a8b;
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <section id="loginView" class="login-wrap">

    <div class="login-card">

      <div class="login-icon">✋</div>

      <h1>Raise Your Hand</h1>

      <div class="login-subtitle">
        Staff Sign In
      </div>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Staff email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <button id="loginButton" class="login-btn">
        Sign In
      </button>

      <div id="loginError" class="login-error"></div>

    </div>

  </section>

  <main id="dashboardView" class="page hidden">

    <div class="header">

      <div class="header-left">
        <h1>✋ Raise Your Hand</h1>
        <div class="subtitle">Staff Support Dashboard</div>
      </div>

      <div class="header-actions">

        <div class="count-box">
          Waiting: <span id="waitingCount">0</span>
        </div>

        <button id="signOutButton" class="signout-btn">
          Sign Out
        </button>

        <div id="signedInUser" class="signed-in"></div>

      </div>

    </div>

    <div id="requests" class="requests">
      <div class="empty">Loading requests...</div>
    </div>

    <div class="footer">
      Acceleration Academies • Student Support
    </div>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      doc,
      updateDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDnic_epgNwGm8XGNYosNpvfk8iaREXFk",
      authDomain: "raise-your-hand-10653.firebaseapp.com",
      projectId: "raise-your-hand-10653",
      storageBucket: "raise-your-hand-10653.firebasestorage.app",
      messagingSenderId: "154525540176",
      appId: "1:154525540176:web:00e219db67fe4f0c315655"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginButton = document.getElementById("loginButton");
    const signOutButton = document.getElementById("signOutButton");

    const loginError = document.getElementById("loginError");
    const signedInUser = document.getElementById("signedInUser");

    const requestsContainer = document.getElementById("requests");
    const waitingCount = document.getElementById("waitingCount");

    let unsubscribeRequests = null;

    function showError(message) {
      loginError.textContent = message;
      loginError.style.display = "block";
    }

    function hideError() {
      loginError.textContent = "";
      loginError.style.display = "none";
    }

    function formatTime(timestamp) {
      if (!timestamp) return "Just now";

      const date = timestamp.toDate();
      return date.toLocaleString();
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function handleLogin() {

      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);
        showError("Unable to sign in. Check your email and password.");

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

      }
    }

    loginButton.addEventListener("click", handleLogin);

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleLogin();
      }
    });

    signOutButton.addEventListener("click", async () => {
      await signOut(auth);
    });

    function startRequestListener() {

      if (unsubscribeRequests) {
        unsubscribeRequests();
      }

      const requestsQuery = query(
        collection(db, "requests"),
        orderBy("createdAt", "desc")
      );

      unsubscribeRequests = onSnapshot(
        requestsQuery,
        (snapshot) => {

          requestsContainer.innerHTML = "";

          let waiting = 0;

          if (snapshot.empty) {

            requestsContainer.innerHTML =
              '<div class="empty">No raised hands right now 🎉</div>';

            waitingCount.textContent = "0";
            return;
          }

          snapshot.forEach((documentSnapshot) => {

            const request = documentSnapshot.data();
            const requestId = documentSnapshot.id;

            if (request.status === "WAITING") {
              waiting++;
            }

            const card = document.createElement("div");

            const statusClass =
              request.status === "CLAIMED"
                ? "claimed"
                : request.status === "DONE"
                ? "done"
                : "";

            card.className = `request-card ${statusClass}`;

            const claimedText = request.claimedBy
              ? escapeHtml(request.claimedBy)
              : "Not claimed";

            card.innerHTML = `
              <div class="card-top">

                <div>
                  <div class="student-name">
                    ${escapeHtml(request.studentName)}
                  </div>

                  <div>
                    ${escapeHtml(request.location)}
                  </div>
                </div>

                <span class="status ${request.status.toLowerCase()}">
                  ${escapeHtml(request.status)}
                </span>

              </div>

              <div class="meta">

                <div class="meta-item">
                  <div class="meta-label">Help Needed</div>
                  ${escapeHtml(request.helpType)}
                </div>

                <div class="meta-item">
                  <div class="meta-label">Contact</div>
                  ${escapeHtml(request.contactMethod)}
                </div>

                <div class="meta-item">
                  <div class="meta-label">Submitted</div>
                  ${formatTime(request.createdAt)}
                </div>

                <div class="meta-item">
                  <div class="meta-label">Claimed By</div>
                  ${claimedText}
                </div>

              </div>

              ${
                request.details
                  ? `
                    <div class="details">
                      <strong>Student note:</strong><br>
                      ${escapeHtml(request.details)}
                    </div>
                  `
                  : ""
              }

              <div class="actions">

                ${
                  request.status === "WAITING"
                    ? `
                      <button
                        class="claim-btn"
                        data-action="claim"
                        data-id="${requestId}">
                        Claim Request
                      </button>
                    `
                    : ""
                }

                ${
                  request.status === "CLAIMED"
                    ? `
                      <button
                        class="done-btn"
                        data-action="done"
                        data-id="${requestId}">
                        Mark Done
                      </button>
                    `
                    : ""
                }

              </div>
            `;

            requestsContainer.appendChild(card);
          });

          waitingCount.textContent = waiting;
        },
        (error) => {

          console.error(error);

          requestsContainer.innerHTML =
            '<div class="empty">Unable to load requests.</div>';

        }
      );
    }

    requestsContainer.addEventListener("click", async (event) => {

      const button = event.target.closest("button");

      if (!button) return;

      const requestId = button.dataset.id;
      const action = button.dataset.action;

      if (action === "claim") {

        const staffName = prompt(
          "Enter your name so the team knows who claimed this request:"
        );

        if (!staffName || !staffName.trim()) return;

        await updateDoc(
          doc(db, "requests", requestId),
          {
            status: "CLAIMED",
            claimedBy: staffName.trim(),
            claimedAt: serverTimestamp()
          }
        );
      }

      if (action === "done") {

        await updateDoc(
          doc(db, "requests", requestId),
          {
            status: "DONE",
            completedAt: serverTimestamp()
          }
        );
      }
    });

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");

        signedInUser.textContent =
          `Signed in as ${user.email}`;

        startRequestListener();

      } else {

        dashboardView.classList.add("hidden");
        loginView.classList.remove("hidden");

        signedInUser.textContent = "";

        if (unsubscribeRequests) {
          unsubscribeRequests();
          unsubscribeRequests = null;
        }
      }
    });

  </script>

</body>
</html>
